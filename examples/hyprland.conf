# Example Multi-Monitor Setup with TV Overscan Compensation (hyprland.conf syntax)
# Hardware: Laptop internal display + AKAI LED22D20 Dx 22" 1080p TV
# Tested on: Hyprland v0.56.2 with hyprland-overscan patch

# Fallback rule
monitor = , preferred, auto, 1.25

# 1. Laptop Internal Display (eDP-1)
monitor = eDP-1, 1920x1080@60.00, 1920x0, 1.25

# 2. Television with Hardware Overscan (HDMI-A-1)
# Device: AKAI LED22D20 Dx (56cm / 22" Full HD LED TV)
# EDID identifier: GDH CHHWJT 0x01000000
#
# Supported modes:
#   1920x1080@59.94Hz, 1920x1080@50.00Hz, 1280x720@60.00Hz
monitorv2 = HDMI-A-1, 1920x1080@59.93900, 3456x0, 1, {
    overscan_l = 50,
    overscan_r = 50,
    overscan_t = 30,
    overscan_b = 30
}
